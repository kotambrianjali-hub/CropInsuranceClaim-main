services:
  - type: web
    name: crop-insurance-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crop-insurance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: crop-insurance-db
    databaseName: crop_insurance
    user: crop_user
    plan: free
